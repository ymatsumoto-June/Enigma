<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width">
	
	<title>お問い合わせフォーム</title>
	
	<!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" 
	integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" 
	crossorigin="anonymous">

	<!-- Optional theme -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" 
	integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" 
	crossorigin="anonymous">

	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="container">
		<header>
			<h1>お問い合わせフォーム</h1>
		</header>
		
		<div class="row">
			<div class="col-sm-8 col-sm-offset-2">
				<div class="form-group">
					<label for="name">お名前</label>
					<input type="text" id="name" name="name" class="form-control" placeholder="例）山田　太郎"> 
				</div>
				
				<div class="form-group">
					<label for="job">ご職業</label>
					<select id="job" name="job" class="form-control">
						<option value="">選択してください</option>
						<option value="会社員">会社員</option>
						<option value="学生">学生</option>
						<option value="その他">その他</option>
					</select>
				</div>
				
				<div class="form-group">
					<label for="addEnigma">追加してほしい暗号</label>
					<input type="text" id="addEnigma" name="addEnigma" class="form-control"> 
				</div>

				<div class="form-group">
					<label for="sentence">ご意見</label>
					<textarea name="sentence" id="sentence" rows="10" class="form-control"></textarea>
				</div>
				
				<button type="submit" class="btn">送信する</button>
			</div>
		</div>
	</div>

</body>
</html>
